name: Обновить новостную ленту

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-news-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Получить сайт
        uses: actions/checkout@v4
      - name: Настроить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Собрать RSS и Atom-ленты
        run: python collector.py
      - name: Сохранить обновлённую ленту
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          if git diff --cached --quiet; then
            echo "Изменений в ленте нет"
          else
            git commit -m "Обновить ленту новостей"
            git push
          fi
